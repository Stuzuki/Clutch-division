<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clutch Division</title></head><body><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<title>Clutch Division</title>
<meta name="description" content="Clutch Division est un jeu de manager esport gratuit dans le navigateur : dirige une organisation de FPS tactique 5v5 à travers quatre régions, des Kickoffs jusqu'au Mondial.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Anton&display=swap">
<style>
/* Concept : console de tournoi. Bandeau complet en haut, rail à gauche, angles coupés sur l'action principale. Thème sombre unique, assumé. */
:root{
  color-scheme:dark;
  --bg:#0d121b;--rail:#0f151f;--panel:#151b26;--panel2:#1f2632;--line:#2c3543;--line2:#222a37;--track:#0a0f17;--me:#3a1b25;
  --fg:#f2f4f8;--dim:#9aa4b4;
  --signal:#ff4655;--ink:#14181f;--gold:#f5c451;
  --mine:#43d9c6;--foe:#ff8a70;--good:#6fe08f;--bad:#ff8a70;
  --ko:#ff4655;--ma:#f5c451;--sp:#5f9dff;--wo:#a77ff5;--sc:#4fd1b0;
  --display:"Chakra Petch","Arial Narrow",Impact,sans-serif;
  --label:"Chakra Petch","Arial Narrow",sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --top:76px;--hud:#12161d;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--rail)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:25px}h3{font-size:19px}p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:600 15px/1.2 var(--label);letter-spacing:.03em}
button:hover:not(:disabled){border-color:var(--signal)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
textarea{font:inherit;color:inherit;width:100%;resize:vertical}
input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);padding:9px 11px;border-radius:8px;max-width:100%}
.cta{background:var(--signal);border-color:var(--signal);color:var(--ink);font-weight:700;font-size:16px;letter-spacing:.09em;padding:13px 22px;text-transform:uppercase}
.cta:not(.small){border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%)}
.cta:hover:not(:disabled){filter:brightness(1.1)}
.cta .ar{width:18px;height:18px;vertical-align:-4px;margin-left:10px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.small{padding:5px 9px;font-size:13px}
.lab{font:600 13px/1.2 var(--label);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.sig{color:var(--signal)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 13px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr.me td{background:var(--me)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.n,th.n{text-align:right}
.badge{display:inline-block;font:700 13px/1 var(--label);letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:var(--panel2);color:var(--fg)}
.badge.on{background:var(--signal);color:var(--ink)}
.badge.gd{background:#1f5a3c;color:#d7ffe5}.badge.bd{background:#6b2d24;color:#ffe4dd}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;width:100%;display:block}
.bar i{display:block;height:100%;background:var(--mine)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{background:transparent;border:0;border-radius:0;border-bottom:3px solid transparent;font-size:16px;padding:6px 10px}
.tabs button.on{border-color:var(--signal);color:var(--signal)}
.seg{display:inline-flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel)}
.seg button.on{background:var(--signal);color:var(--ink)}
.stars{position:relative;display:inline-block;color:var(--line);letter-spacing:1px;font-size:14px;line-height:1}
.stars i{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);font-style:normal;white-space:nowrap}
.linkish{background:none;border:0;padding:0;color:var(--mine);font:inherit;text-align:left}
.linkish:hover{text-decoration:underline}

/* Coque */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.side{background:var(--rail);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:18px 12px;gap:2px;position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow-y:auto}
.side .gap{height:16px;flex:none}
.side .spring{flex:1 0 16px}
.side button{display:flex;align-items:center;gap:13px;background:none;border:0;border-left:3px solid transparent;padding:10px 12px;font:600 16px/1.1 var(--body);letter-spacing:0;text-align:left;position:relative;border-radius:8px}
.side button:hover:not(.on){background:var(--panel)}
.side button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side button.on{border-left-color:var(--signal);background:var(--me)}
.side button.on svg{color:var(--signal)}
.dot{margin-left:auto;background:var(--signal);color:var(--fg);font:700 12px/22px var(--label);min-width:22px;height:22px;text-align:center;border-radius:11px;padding-inline:4px}
.dot.w{background:var(--gold);color:var(--ink)}
.main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:grid;gap:18px;align-content:start;min-width:0}
.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:var(--top);background:var(--rail);display:flex;gap:18px 26px;align-items:center;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line2)}
.top .id{display:flex;gap:12px;align-items:center;min-width:0}
.top .nm{font:700 19px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.top .sub{font-size:13px;color:var(--dim);margin-top:3px;white-space:nowrap}
.hnav{display:flex;gap:6px;flex:none}
.hnav button{background:none;border:0;padding:6px;color:var(--dim);display:grid;place-items:center}
.hnav button:hover:not(:disabled){color:var(--fg)}
.hnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:32px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;min-width:0}
.hright{margin-left:auto;display:flex;align-items:center;gap:18px;flex:none}
.datebox{text-align:right;display:grid;gap:3px}
.datebox b{font:700 16px/1.1 var(--label)}
.datebox span{font-size:13px;line-height:1.1;color:var(--dim)}

/* Écrans titre */
.title{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:grid;gap:24px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,92px);line-height:.92;text-transform:uppercase}
.hero h1 span{color:var(--signal);display:block}
.lede{font-size:19px;max-width:34em}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;max-width:900px;margin-inline:auto;width:100%}
.choice button{display:grid;gap:12px;padding:30px;text-align:left;background:var(--panel);font:400 17px/1.4 var(--body)}
.choice b{font:700 26px/1 var(--display)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.teamgrid button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);min-width:0}
.teamgrid button.on{border-color:var(--signal);background:var(--panel2)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;padding:0;border:2px solid transparent}
.sw button.on{border-color:var(--fg)}
canvas{display:block;width:100%;aspect-ratio:1/1;background:var(--track);border-radius:12px}
.mapwrap{position:relative;width:100%;max-width:100%}

/* Cartes joueurs */
.pcard{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px;display:grid;gap:7px;align-content:start;min-width:0;position:relative}
.pcard .pic{display:grid;place-items:center;background:var(--panel2);border-radius:8px;overflow:hidden}
.pcard b.n{font:700 18px/1.05 var(--display);overflow-wrap:anywhere}
input.god{width:68px;padding:6px 8px}
.pfl{background:none;border:0;padding:0;display:grid;gap:7px;text-align:left;color:inherit;font:inherit;letter-spacing:0;border-radius:8px}
.pfl:hover .n{color:var(--signal)}
.pfl:hover .pic{outline:2px solid var(--signal)}
.pcard button.more{position:absolute;right:10px;top:10px;padding:2px 8px;font-size:15px}

/* E-mail */
.mailg{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.mailitem{display:grid;gap:3px;text-align:left;background:var(--panel);width:100%;font:400 15px/1.3 var(--body)}
.mailitem.on{border-color:var(--signal)}
.mailitem b{font:600 17px/1.1 var(--label)}
.unread{color:var(--signal)}

/* Calendrier */
.t-ko{--c:var(--ko)}.t-ma{--c:var(--ma)}.t-sp{--c:var(--sp)}.t-wo{--c:var(--wo)}.t-sc{--c:var(--sc)}
.tgrid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:28px;align-items:start}
.tcol{display:grid;gap:12px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 15px/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);opacity:.9}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--signal);transform:rotate(45deg);flex:none}
.eyebrow em{margin-left:auto;font:500 13px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--dim)}
.calbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px 18px 18px;display:grid;gap:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.calhead h2{font-size:27px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.calhead h2 span{font-weight:500;color:var(--dim)}
.calhead .row{gap:6px;flex-wrap:nowrap}
.calhead button{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel2);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font:600 13px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;padding-block:4px 6px}
.cal .d{background:var(--panel2);border-radius:7px;min-height:72px;padding:7px 8px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:5px;border:2px solid transparent}
.cal .d b{font:700 16px/1 var(--label)}
.cal .d.off{background:color-mix(in srgb,var(--panel2) 35%,transparent)}
.cal .d.off b{font-weight:500;color:var(--dim);opacity:.6}
.cal .d.now{border-color:var(--signal);background:var(--me)}
.cal .d small{font:600 11px/1.1 var(--label);color:var(--c);overflow-wrap:anywhere}
.cal .d i{display:block;width:18px;height:3px;border-radius:2px;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend u{width:14px;height:3px;border-radius:2px;background:var(--c);text-decoration:none}
.legend u.sq{width:11px;height:11px;background:none;border:2px solid var(--signal);border-radius:2px}
.legend .sc{color:var(--sc)}
.comp{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;align-items:center}
.comp.hot{border-color:color-mix(in srgb,var(--signal) 60%,transparent);background:linear-gradient(90deg,var(--me),var(--panel) 92%)}
.comp .code{width:58px;height:58px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:700 19px/1 var(--label);color:var(--c)}
.comp .inf{display:grid;gap:4px;min-width:0}
.comp .dt{font-size:13px;color:var(--dim)}
.comp .nm{font:700 20px/1.1 var(--display);overflow-wrap:anywhere}
.comp .meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:14px;color:var(--dim)}
.chip{font:700 12px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:4px 6px;border-radius:4px}
.comp .act{display:grid;justify-items:end;gap:8px}
.comp .st{font-size:13px;color:var(--dim);white-space:nowrap}
.comp .pill{font:700 13px/1 var(--label);color:var(--fg);background:var(--signal);padding:4px 8px;border-radius:5px;white-space:nowrap}
.comp .det{display:inline-flex;align-items:center;gap:10px;background:none;padding:11px 15px;white-space:nowrap}

/* Tableau final */

/* Match */
.score{background:var(--panel);border:1px solid var(--line2);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:12px 16px}
.score .t{display:flex;align-items:center;gap:10px;min-width:0;font:700 20px/1 var(--display);overflow-wrap:anywhere}
.score .t.r{justify-content:flex-end;text-align:right}
.score .c{text-align:center}
.score .nums{font:900 54px/1 var(--display)}
.score .nums i{font-style:normal;color:var(--dim);padding-inline:8px}
.live{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:16px;align-items:start}
.ov{position:absolute;inset:0;display:grid;place-content:center;gap:12px;justify-items:center;background:rgba(9,24,31,.82);text-align:center;padding:16px}
.ov b{font:700 34px/1 var(--display)}
.banner{position:absolute;left:0;right:0;top:12%;text-align:center;padding:8px;font:700 22px/1 var(--display);background:rgba(9,24,31,.88)}
.feed{height:150px;overflow-y:auto;display:grid;gap:3px;align-content:start;font-size:15px}
.feed div{overflow-wrap:anywhere}
.m{color:var(--mine);font-weight:600}.f{color:var(--foe);font-weight:600}.pc{opacity:.45;text-decoration:line-through}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.ctrl>div{display:grid;gap:5px;align-content:start}
.mapcard{display:grid;gap:6px;background:var(--panel2);border-radius:10px;padding:12px}
.mapcard.out{opacity:.4}.mapcard.picked{outline:2px solid var(--signal)}
.mapcard b{font:700 18px/1.05 var(--display)}
.note{border-left:3px solid var(--signal);padding-left:10px}
.alert{padding:8px 12px;background:var(--panel2);border-radius:6px;border-left:3px solid var(--good)}
.alert.w{border-left-color:var(--foe)}
.modal{position:fixed;inset:0;background:rgba(5,14,19,.78);display:grid;place-items:center;z-index:30;padding:16px}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(640px,100%);max-height:90vh;overflow-y:auto;display:grid;gap:12px}
.tl{display:flex;gap:6px;overflow-x:auto}
.tl span{flex:none;padding:6px 10px;background:var(--panel2);border-radius:6px;font:600 14px/1.1 var(--label)}
.tl span.on{background:var(--signal);color:var(--ink)}.tl span.done{opacity:.4}.tl span.out{opacity:.35;text-decoration:line-through}
/* Affichage en match */
.hudpage{max-width:1420px;padding-block:0 40px;gap:12px}
.hudtop{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:16px}
.hudtop::before{content:"";position:absolute;inset:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) auto;height:44px;background:linear-gradient(90deg,var(--hud),color-mix(in srgb,var(--hud) 55%,transparent) 50%,var(--hud))}
.ht-l,.ht-r{position:relative;min-height:30px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px;font:600 13px/1.2 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.ht-r{justify-content:flex-end;text-align:right;color:var(--fg);min-height:44px}
.ht-l{font-size:18px;letter-spacing:.03em;min-height:44px;padding-block:3px;gap:0 14px}
.ht-m{display:inline-flex;align-items:center;gap:8px}.ht-m b{color:var(--fg);font-weight:600}
.ht-c{position:relative;display:grid;justify-items:center}
.ht-plate{display:flex;align-items:stretch;background:var(--hud);min-height:62px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,24px 100%)}
.ht-t{display:flex;align-items:center;gap:12px;padding:6px 26px 6px 44px;background:linear-gradient(100deg,var(--hud) 42%,color-mix(in srgb,var(--c0) 72%,var(--hud)))}
.ht-t.r{padding:6px 44px 6px 26px;background:linear-gradient(260deg,var(--hud) 42%,color-mix(in srgb,var(--c1) 72%,var(--hud)))}
.hlg{display:inline-grid;place-items:center;flex:none}.hlg img,.hlg svg{display:block;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 7px rgba(255,255,255,.5))}
.ht-tg{display:grid;justify-items:center;gap:2px}.ht-tg b{font:700 23px/1 var(--display)}.ht-tg small{font:600 11px/1 var(--label);letter-spacing:.14em;color:var(--dim)}
.ht-n{font:700 46px/1 var(--display)}
.clock{position:relative;display:grid;place-content:center;justify-items:center;gap:2px;min-width:140px;padding-inline:14px;background:var(--hud);margin-inline:-10px;z-index:1;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%)}
.clock small{font:600 12px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.clock b{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.clock b.pl{color:var(--signal);display:grid;place-items:center}.clock b.pl svg,.clock b.pl img{width:36px;height:36px;animation:bombpulse 1s ease-in-out infinite}@keyframes bombpulse{50%{opacity:.55;transform:scale(.9)}}
.ht-tabs{display:flex;justify-content:space-between;width:100%;padding-inline:60px}
.ht-tab{background:var(--hud);padding:5px 15px 6px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,9px 100%)}
.pips{display:flex;gap:9px}.pips i{width:7px;height:7px;border:1.5px solid var(--fg);transform:rotate(45deg);display:block}.pips i.on{background:var(--fg)}
.hobj{text-align:center}
.hudg{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,290px);gap:14px;align-items:start}
.hmap{max-width:660px;margin-inline:auto}
.hcol{display:grid;gap:10px;min-width:0}
.hc{display:grid;grid-template-columns:46px minmax(0,1fr);background:var(--hud);min-height:86px}
.hc.r{grid-template-columns:minmax(0,1fr) 46px}.hc.r .hc-l{order:2}
.hc-l{display:grid;align-content:start;justify-items:center;gap:0;background:var(--panel2)}
.hp-pic{width:46px;height:46px;overflow:hidden}

/* ===== Couche design v2 ===== */
:root{--bg:#0a0e15;--rail:#0c1119;--panel:#121823;--panel2:#1a2130;--line:#283244;--line2:#1d2533;--track:#080c12;--me:#2a1520;
 --team:#ff4655;--glass:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%);
 --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);--sh2:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -14px rgba(0,0,0,.75);--r:14px}
body{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--team) 14%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(95,157,255,.07),transparent 60%),var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
#app{position:relative;z-index:1}
::selection{background:color-mix(in srgb,var(--team) 45%,transparent)}
*{scrollbar-width:thin;scrollbar-color:#2c3646 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c3646;border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#3a475c;background-clip:padding-box;border:2px solid transparent}
/* Panneaux */
.panel,.comp,.mday,.bm,.tile,.calbox{position:relative}
.panel{background:var(--glass),var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh1);padding:20px;transition:border-color .2s}
.panel:hover{border-color:#263042}
.panel>.lab:first-child,.panel>h3:first-child{display:flex;align-items:center;gap:9px;color:var(--fg);font:700 13px/1.2 var(--label);letter-spacing:.14em}
.panel>.lab:first-child::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--team),color-mix(in srgb,var(--team) 40%,transparent));flex:none}
.g2,.g3{gap:18px}.main{gap:20px}
/* Barre du haut */
.top{background:color-mix(in srgb,var(--rail) 82%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line2);box-shadow:0 1px 0 color-mix(in srgb,var(--team) 30%,transparent),0 12px 30px -20px rgba(0,0,0,.8)}
.top h1{font-size:30px;letter-spacing:.06em;background:linear-gradient(180deg,#fff,#c9d1de);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .nm{letter-spacing:.04em}
.datebox b{font-size:17px}
/* Menu latéral */
.side{background:linear-gradient(180deg,var(--rail),color-mix(in srgb,var(--rail) 70%,#000));border-right:1px solid var(--line2);padding:16px 12px;gap:3px}
.side button{border-left:0;padding:10px 12px;color:#c4ccd8;transition:background .15s,color .15s,transform .15s;border-radius:10px;font-weight:600}
.side button svg{color:#7d889a;transition:color .15s}
.side button:hover:not(.on){background:rgba(255,255,255,.04);color:#fff}
.side button:hover:not(.on) svg{color:#c4ccd8}
.side button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--team) 22%,transparent),color-mix(in srgb,var(--team) 4%,transparent));color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--team) 30%,transparent)}
.side button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--team);box-shadow:0 0 12px var(--team)}
.side button.on svg{color:var(--team);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--team) 60%,transparent))}
.dot{box-shadow:0 0 0 2px var(--rail),0 0 10px color-mix(in srgb,var(--signal) 50%,transparent)}
/* Boutons */
button{transition:background .15s,border-color .15s,transform .12s,box-shadow .15s,filter .15s;background:linear-gradient(180deg,#212a3a,#1a2130);border-color:#2b3547}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--team) 70%,#fff 0%);box-shadow:0 0 0 3px color-mix(in srgb,var(--team) 14%,transparent)}
button:active:not(:disabled){transform:translateY(1px)}
.cta{background:linear-gradient(180deg,#ff5a68,#e83a4a);border-color:#ff5a68;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 8px 24px -10px rgba(255,70,85,.8)}
.cta:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 10px 28px -8px rgba(255,70,85,.9)}
.small{border-radius:7px}
.side button,.tabs button,.hnav button,.sx-like,.sx-lnk,.linkish{background:none;box-shadow:none}
.side button:hover,.tabs button:hover,.hnav button:hover{box-shadow:none}
/* Onglets */
.tabs{gap:4px;padding:4px;background:var(--track);border:1px solid var(--line2);border-radius:12px;width:fit-content;max-width:100%}
.tabs button{border:0;border-radius:9px;padding:8px 16px;font-size:15px;color:var(--dim)}
.tabs button:hover:not(.on){color:#fff;background:rgba(255,255,255,.04)}
.tabs button.on{background:linear-gradient(180deg,#252f41,#1c2433);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 12px -4px rgba(0,0,0,.6),inset 0 -2px 0 var(--team)}
.seg{background:var(--track);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border-radius:7px;color:var(--dim)}
.seg button.on{background:linear-gradient(180deg,#ff5a68,#e83a4a);color:#fff;box-shadow:0 4px 12px -4px rgba(255,70,85,.7)}
/* Champs */
input[type=text],input[type=number],select,textarea{background:var(--track);border:1px solid var(--line);border-radius:9px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--team);box-shadow:0 0 0 3px color-mix(in srgb,var(--team) 20%,transparent)}
/* Tableaux */
table{font-size:14.5px;border-collapse:separate;border-spacing:0}
th{font-size:11.5px;letter-spacing:.12em;padding:9px 10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
td{padding:9px 10px;border-bottom:1px solid var(--line2);transition:background .12s}
tbody tr:hover td,tr:hover>td{background:rgba(255,255,255,.022)}
tr.me td{background:linear-gradient(90deg,color-mix(in srgb,var(--team) 20%,transparent),color-mix(in srgb,var(--team) 6%,transparent))}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--team)}
tr.click:hover td{background:rgba(255,255,255,.045)}
/* Badges, barres */
.badge{border-radius:999px;padding:4px 9px;font-size:12px;background:#222b3b;border:1px solid #2c3648}
.badge.gd{background:rgba(111,224,143,.14);color:#9df0b5;border-color:rgba(111,224,143,.35)}
.badge.bd{background:rgba(255,138,112,.12);color:#ffb3a1;border-color:rgba(255,138,112,.35)}
.badge.on{background:var(--signal);border-color:var(--signal);color:#fff}
.bar{height:7px;background:var(--track);border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.bar i{border-radius:99px;background:linear-gradient(90deg,#2bb7a6,var(--mine));box-shadow:0 0 10px rgba(67,217,198,.35)}
.mini{border-radius:99px}.mini i{border-radius:99px}
/* Tuiles */
.tiles{gap:10px}
.tile{background:linear-gradient(180deg,#1d2534,#171e2b);border:1px solid #232c3c;border-radius:11px;padding:12px 13px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.tile b{font-size:22px;background:linear-gradient(180deg,#fff,#cfd6e2);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .lab{letter-spacing:.12em}
/* Alertes */
.alert{background:linear-gradient(90deg,rgba(111,224,143,.08),rgba(255,255,255,.015));border:1px solid rgba(111,224,143,.18);border-left:3px solid var(--good);border-radius:10px;padding:10px 14px}
.alert.w{background:linear-gradient(90deg,rgba(255,138,112,.09),rgba(255,255,255,.015));border-color:rgba(255,138,112,.22);border-left-color:var(--foe)}
/* Fenêtres */
.modal{background:rgba(4,7,12,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:mfade .18s ease-out}
.modal>div{background:var(--glass),var(--panel);border:1px solid #2a3446;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.03) inset;animation:mpop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mfade{from{background:rgba(4,7,12,.2)}}
@keyframes mpop{from{transform:translateY(8px) scale(.985)}}
/* Cartes de compétition, bandeau club */
.comp{background:var(--glass),var(--panel);border-radius:var(--r);box-shadow:var(--sh1);transition:transform .15s,border-color .15s,box-shadow .15s}
.comp:hover{transform:translateY(-2px);border-color:#2b3547;box-shadow:var(--sh2)}
.clubband{border-radius:16px;box-shadow:var(--sh2);background:radial-gradient(600px 200px at 0% 50%,color-mix(in srgb,var(--c0) 32%,transparent),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel)}
.clubband h2{font-size:28px}
.eyebrow::before{background:var(--team);box-shadow:0 0 10px var(--team)}
/* Entrée des écrans */
.main.enter>*{animation:rise .32s ease-out both}
.main.enter>*:nth-child(2){animation-delay:.03s}.main.enter>*:nth-child(3){animation-delay:.06s}.main.enter>*:nth-child(4){animation-delay:.09s}.main.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{transform:translateY(6px)}}
/* Réseau, bracket : petits raffinements */
.sx-post{transition:background .15s}.sx-post:hover{background:rgba(255,255,255,.015)}
.bm{transition:transform .15s,box-shadow .15s}.bm:hover{transform:translateY(-1px);box-shadow:0 10px 26px -10px rgba(0,0,0,.7)}
.mday{background:var(--glass),var(--panel2)}
@media (prefers-reduced-motion:reduce){.main.enter>*,.modal,.modal>div{animation:none!important}.comp:hover,.bm:hover{transform:none}}
/* ===== Petites animations ===== */
/* Bouton principal : reflet qui passe */
.cta{position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none}

/* Pastilles de notification qui respirent */

/* Icônes du menu qui bougent au survol */

.main.enter tr:nth-child(2){animation-delay:.03s}.main.enter tr:nth-child(3){animation-delay:.06s}.main.enter tr:nth-child(4){animation-delay:.09s}.main.enter tr:nth-child(5){animation-delay:.12s}.main.enter tr:nth-child(6){animation-delay:.15s}.main.enter tr:nth-child(7){animation-delay:.18s}.main.enter tr:nth-child(8){animation-delay:.21s}.main.enter tr:nth-child(n+9){animation-delay:.24s}

.dec-c p{font:600 16px/1.35 var(--body)}
.dec-o{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dec-o button{display:grid;gap:3px;text-align:left;padding:10px 12px}
.dec-o button b{font:700 14px/1.2 var(--label)}
.dec-o button small{font:500 12px/1.25 var(--body);color:var(--dim)}
.dec-t{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.dec-t i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--signal));transition:width .1s linear}
.ht{display:grid;gap:10px;width:min(560px,100%);text-align:left}
.rdx{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line2);font-size:13px;text-align:left}
#ctrl .rdx{grid-column:1/-1}
/* ===== Interface v3 ===== */
:root{--team-ink:#fff}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lnk{background:none!important;border:0!important;box-shadow:none!important;padding:0;color:var(--team);font:700 13px/1.2 var(--body);letter-spacing:0;cursor:pointer}
.lnk:hover{text-decoration:underline}
.tc{background:var(--team)!important;border-color:var(--team)!important;color:var(--team-ink)!important;font-weight:700}
.tc:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 24px -10px var(--team)!important}
.cta.tc{text-shadow:none;box-shadow:0 8px 24px -12px var(--team)}
.cta.tc:not(.small){border-radius:10px;clip-path:none}
/* Barre du haut */
.top{gap:14px 20px}
.top .id .lg,.top .id>span:first-child{border-radius:10px}
.top .nm{font-size:18px}
.top .sub{font-size:12.5px}
.hnav{gap:6px}
.hnav button{width:36px;height:36px;border:1px solid var(--line)!important;border-radius:9px;background:var(--panel)!important}
.hnav button:disabled{opacity:.4}
.gs{position:relative;flex:1 1 280px;max-width:460px;display:flex;align-items:center;gap:8px;padding:0 10px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.gs>svg{width:17px;height:17px;flex:none;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
.gs input{flex:1;min-width:0;background:none!important;border:0!important;box-shadow:none!important;padding:0;font-size:14px;outline:none}
.gs kbd{font:600 11px/1 var(--label);color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 6px;flex:none}
.gs:focus-within{border-color:var(--team);box-shadow:0 0 0 3px color-mix(in srgb,var(--team) 18%,transparent)}
.gs-r{position:absolute;left:0;right:0;top:calc(100% + 6px);display:none;max-height:420px;overflow:auto;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px -15px rgba(0,0,0,.9);z-index:40}
.gs-r.on{display:grid;gap:2px}
.gs-h{font:700 11px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:8px 8px 4px}
.gs-r button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;box-shadow:none}
.gs-r button:hover{background:rgba(255,255,255,.05);box-shadow:none}
.gs-r small{color:var(--dim);font-size:12px}
@media (max-width:1180px){.gs kbd{display:none}}
@media (max-width:900px){.gs{order:5;flex-basis:100%;max-width:none}}
/* Menu */
.side{padding:14px 12px}
.side .sg{font:700 11px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:#6b7688;padding:16px 12px 6px}
.side .sg:first-child{padding-top:4px}
.side button{padding:9px 12px;font-size:15px}
.side button.on{background:color-mix(in srgb,var(--team) 12%,var(--panel))!important;box-shadow:none!important;color:#fff}
.side button.on::before{left:-12px;background:var(--team);box-shadow:0 0 12px var(--team)}
.side button.on svg{color:var(--team)}
.ptitle{font:900 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 -4px}
/* Accueil */
.hm-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hm-h .lab{color:var(--fg);font:700 13px/1.2 var(--label);letter-spacing:.14em}
.hm-h .lab .dim{font-weight:600;letter-spacing:.08em}
.hm-step{padding:16px 20px}
.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:0}
.stp-i{position:relative;display:grid;gap:3px;padding-top:24px;min-width:0}
.stp-i::before{content:"";position:absolute;top:7px;left:16px;right:4px;height:2px;background:var(--line)}
.stp-i:last-child::before{display:none}
.stp-i.done::before{background:color-mix(in srgb,var(--team) 70%,transparent)}
.stp-i.on::before{background:linear-gradient(90deg,var(--team) 25%,var(--line) 25%)}
.stp-d{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;border:2px solid #4a5568;background:var(--panel)}
.stp-i.done .stp-d{background:var(--team);border-color:var(--team)}
.stp-i.on .stp-d{background:var(--team);border-color:var(--team);box-shadow:0 0 0 4px color-mix(in srgb,var(--team) 25%,transparent);animation:nowRing2 2s ease-in-out infinite}
@keyframes nowRing2{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--team) 10%,transparent)}}
.stp-i b{font:600 13.5px/1.2 var(--body);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-i.on b{color:#fff;font-weight:800}
.stp-i small{font-size:11.5px;color:#6b7688}
.stp-i.on small{color:var(--team)}
.hm-g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.hm-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:1180px){.hm-g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.hm-g2,.hm-g3{grid-template-columns:minmax(0,1fr)}}
.hm-hero{position:relative;overflow:hidden;grid-template-columns:minmax(0,1fr) auto;align-items:start;padding:28px;background:radial-gradient(500px 300px at 85% 30%,color-mix(in srgb,var(--team) 12%,transparent),transparent 70%),var(--panel)!important;border-color:color-mix(in srgb,var(--team) 22%,var(--line2))!important}
.hm-ring{position:absolute;right:-90px;top:-40px;width:380px;height:380px;border-radius:50%;border:44px solid color-mix(in srgb,var(--team) 9%,transparent);pointer-events:none}
.hm-hl{position:relative;display:grid;gap:12px;min-width:0}
.hm-eb{font:800 12px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--team)}
.hm-big{font:900 clamp(30px,3.6vw,44px)/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.hm-hero p{margin:0;color:#c4ccd8}
.hm-cd{position:relative;display:grid;justify-items:end;text-align:right}
.hm-cd b{font:900 clamp(56px,6vw,84px)/.9 var(--display);letter-spacing:-.02em}
.hm-cd span{font:700 12px/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hm-prog{display:grid;gap:7px;font-size:13px;color:var(--dim);max-width:520px}
.hm-bar{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.hm-bar i{display:block;height:100%;border-radius:99px}
.hm-hero .row button{padding:11px 18px;border-radius:10px;font-size:14px}
.hm-vs{display:flex;align-items:center;gap:16px}
.hm-vs b{font:900 22px/1 var(--display);color:var(--dim)}
.hm-sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hm-st{display:grid;gap:6px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line2);transition:border-color .2s,transform .2s}
.hm-st:hover{border-color:color-mix(in srgb,var(--team) 40%,var(--line2));transform:translateY(-1px)}
.hm-st b{font:900 28px/1 var(--display)}
.hm-st small{font-size:12.5px;color:var(--dim)}
.hm-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hm-form .lab{margin-right:6px}
.fm2{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;border:1px dashed #3a4558;font:800 12px/1 var(--label)}
.fm2.w{border:0;background:rgba(111,224,143,.18);color:var(--good)}.fm2.l{border:0;background:rgba(255,70,85,.16);color:#ff7a86}
.hm-sq{align-content:start}
.hm-pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.02)!important;border:1px solid var(--line2)!important;box-shadow:none!important}
.hm-pl:hover{border-color:color-mix(in srgb,var(--team) 45%,var(--line2))!important;background:rgba(255,255,255,.04)!important}
.hm-pi{display:grid;gap:5px;min-width:0}
.hm-pn{display:flex;align-items:baseline;gap:7px;min-width:0}
.hm-pn b{font-size:15px}
.hm-pn small{color:var(--dim);font-size:12.5px;white-space:nowrap}
.hm-igl{font:800 10px/1 var(--label);padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--team) 22%,transparent);color:var(--team);letter-spacing:.06em}
.hm-mf{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px 8px}
.hm-mf small{font-size:11.5px;color:var(--dim)}
.hm-mf .mini{width:100%}
.hm-pl .rt{font-size:17px;padding:6px 8px;min-width:40px;text-align:center}
.hm-rk table{font-size:14px}
.hm-rk td,.hm-rk th{padding:8px 6px}
.hm-tm{display:flex;align-items:center;gap:10px;min-width:0}
.hm-tag{font:800 10px/1 var(--label);letter-spacing:.04em;padding:5px 0;width:30px;text-align:center;border-radius:6px;background:color-mix(in srgb,var(--tc) 18%,#1b2231);color:color-mix(in srgb,var(--tc) 70%,#fff);flex:none}
.hm-tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.hm-rk tr.gap td{text-align:center;color:var(--dim);letter-spacing:.3em;border:0;padding:2px}
.hm-rk tr.me td{background:color-mix(in srgb,var(--team) 14%,transparent)!important}
.hm-rk tr.me td:first-child{box-shadow:inset 3px 0 0 var(--team)}
.hm-cnt{font:700 12px/1 var(--body);padding:5px 9px;border-radius:99px;background:rgba(255,70,85,.15);color:#ff7a86}
.hm-todo{align-content:start}
.hm-td{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line2)}
.hm-td b{font-size:14.5px}
.hm-td p{margin:3px 0 6px;font-size:13px;color:var(--dim)}
.hm-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.hm-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hm-td.bad .hm-ic{background:rgba(255,70,85,.14);color:#ff6b78}
.hm-td.warn .hm-ic{background:rgba(245,196,81,.14);color:var(--gold)}
.hm-td.ok .hm-ic{background:rgba(111,224,143,.14);color:var(--good)}
.hm-td.info .hm-ic{background:rgba(95,157,255,.14);color:var(--sp)}
.hm-e{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:none!important;border:0!important;box-shadow:none!important;padding:6px 4px;border-radius:8px}
.hm-e:hover{background:rgba(255,255,255,.03)!important}
.hm-e i{width:9px;height:9px;border-radius:50%;margin-top:5px}
.hm-e b{display:block;font-size:14px;font-weight:600}.hm-e b.unread{font-weight:800}
.hm-e small{color:var(--dim);font-size:12.5px}
.hm-empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:26px 16px;border:1px dashed #303a4c;border-radius:12px;min-height:180px;align-content:center}
.hm-empty svg{width:26px;height:26px;fill:none;stroke:var(--dim);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hm-empty p{margin:0;font-size:13px;color:var(--dim);max-width:260px}
.hm-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.hm-u{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line2)}
.hm-d{display:grid;justify-items:center}
.hm-d b{font:900 22px/1 var(--display)}
.hm-d small{font:700 10px/1.4 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hm-un{display:grid;min-width:0}.hm-un small{color:var(--dim);font-size:12.5px}
.hm-b{font:800 11px/1 var(--label);padding:6px 9px;border-radius:7px}
.hm-b.r{background:rgba(95,157,255,.14);color:#8fb8ff}.hm-b.m{background:rgba(245,196,81,.16);color:var(--gold)}.hm-b.w{background:rgba(167,127,245,.18);color:#c3a6ff}
/* Écran titre */
.ttl{min-height:100vh;display:grid;grid-template-rows:auto 1fr;padding:0 max(24px,4vw) 32px;background:radial-gradient(900px 600px at 80% 40%,rgba(255,70,85,.06),transparent 60%)}
.ttl-nav{display:flex;justify-content:space-between;align-items:center;padding:26px 0}
.ttl-br{display:flex;align-items:center;gap:10px;font:800 15px/1 var(--label);letter-spacing:.2em;text-transform:uppercase}
.ttl-br i{width:11px;height:11px;background:var(--signal);transform:rotate(45deg)}
.lnk2{background:none!important;border:0!important;box-shadow:none!important;color:#c4ccd8;font:500 14px/1 var(--body);letter-spacing:0;padding:6px 10px}
.lnk2:hover{color:#fff}
.ttl-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vw;align-items:center;max-width:1300px;width:100%;margin:0 auto}
.ttl-l{display:grid;gap:20px;max-width:480px}
.ttl-eb{font:700 13px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ttl h1{display:grid;font:900 clamp(64px,9vw,118px)/.86 var(--display);letter-spacing:-.01em;text-transform:uppercase;margin:0}
.ttl h1 span:first-child{color:#e8ecf3}.ttl h1 span:last-child{color:var(--signal)}
.ttl-l>p{font-size:17px;color:#c4ccd8;margin:0}
.ttl-menu{display:grid;gap:10px;margin-top:6px}
.ttl-cont{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:16px 20px!important;border-radius:12px!important;background:linear-gradient(180deg,#ff5a68,#ec3b4b)!important;border:0!important;color:#fff;box-shadow:0 16px 40px -18px rgba(255,70,85,.9)!important}
.ttl-cont b{display:block;font:900 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.ttl-cont small{font-size:12.5px;opacity:.9}
.ttl-cont svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.ttl-cont:hover svg{transform:translateX(4px)}
.ttl-it{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:14px 18px!important;border-radius:12px!important;background:var(--panel)!important;border:1px solid var(--line2)!important}
.ttl-it:hover{border-color:#3a4558!important;background:#161d2a!important}

.ttl-it.first{background:linear-gradient(180deg,#ff5a68,#ec3b4b)!important;border:0!important}.ttl-it.first svg{stroke:#fff}.ttl-it.first small{color:rgba(255,255,255,.85)}
.ttl-r{display:grid;gap:10px}
.ttl-card{position:relative;padding:18px;border-radius:20px;background:#0f141d;border:1px solid var(--line2);box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}

.ttl-badges{position:absolute;top:22px;left:24px;right:24px;display:flex;gap:8px;z-index:2;align-items:center}
.ttl-badges span{font:800 11px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.b-a{background:rgba(255,70,85,.16);color:#ff7a86}.b-d{background:rgba(67,217,198,.14);color:var(--mine)}

@media (max-width:900px){.ttl-hero{grid-template-columns:minmax(0,1fr)}.ttl-r{order:-1}.ttl{padding-inline:16px}}

.ng-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.ng-g3{grid-template-columns:minmax(0,1fr)}}

/* ---------- Match en direct ---------- */
function startMatch(mm){
 const m=mm.m,oppId=m.a===G.me?m.b:m.a;
 M={m,t:mm.t,flip:m.b===G.me,opp:G.teams[oppId],bo:m.bo,label:mm.t.name+" · "+(mm.t.v&&m.g?(m.g==="T"?"Journée "+(m.r+1):"Groupe "+m.g+", journée "+(m.r+1)):m.g?"Groupe "+m.g+", semaine "+(G.step+1):(m.gs?"Groupe "+m.gs+" · ":"")+BR_LABEL[m.label]),phase:"veto",pool:[...mapPool()],steps:vetoSteps(m.bo,mapPool().length),maps:[],banned:[],i:0,serie:[0,0],res:[]};
 G.view="match";render();
}
function vetoAct(map){
 const s=M.steps.shift();M.pool=M.pool.filter(x=>x!==map);if(s==="ban")M.banned.push(map);else M.maps.push(map);
 while(M.steps[0]&&M.steps[0].startsWith("ai")){
  const st=M.steps.shift(),sorted=[...M.pool].sort((a,b)=>(M.opp.maps[b]-me().maps[b])-(M.opp.maps[a]-me().maps[a]));
  if(st==="aiban"){const m=sorted[sorted.length-1];M.pool=M.pool.filter(x=>x!==m);M.banned.push(m)}
  else{const m=sorted[0];M.pool=M.pool.filter(x=>x!==m);M.maps.push(m)}
 }
 if(!M.steps.length){M.maps.push(...M.pool);M.phase="plan"}
}
function makeSim(){const S=newSim(M.maps[M.i],me(),M.opp,Math.random()<.5,{atk:"plan",def:"plan",eco:"auto"});S.isMine=true;return S}
function beginMap(){
 M.S=makeSim();try{boIncident(M.S)}catch(e){}M.phase="live";render();
 addFeed(`<span class="dim">${esc(M.maps[M.i])} : vous commencez en ${M.S.start?"attaque":"défense"}.</span>`);if(M.S.incTxt)addFeed(M.S.incTxt);
 LAST=performance.now();if(!RAF)RAF=requestAnimationFrame(frame);
}
const COLS=()=>[me().color,"#ff8a70"];
function frame(now){
 if(!(G&&G.view==="match"&&M&&M.phase==="live")){RAF=0;return}
 RAF=requestAnimationFrame(frame);
 const S=M.S,dt=Math.min(.1,(now-LAST)/1000);LAST=now;
 const cv=$("#cv");if(!cv)return;
 if(S.dec){S.decT-=dt;drawMap(cv,S.map,null,0,COLS());paintDec();if(S.decT<=0)decPick(-1);return}if(S.pause){drawMap(cv,S.map,null,0,COLS());return}
 if(S.tout>0){S.tout-=dt;drawMap(cv,S.map,S.cur,S.cur?Math.min(S.t,S.cur.T):0,COLS());paintTimeout();return}
 if(S.wait>0){S.wait-=dt*S.speed;if(S.wait<=0){const b=$("#ban");if(b)b.remove();afterRound();if(!mapOver(S))try{roundExtras(S)}catch(e){}if(S.toQ&&!mapOver(S)&&!S.pause)startTimeout(S)}return}
 if(!S.cur)startRound();
 const r=S.cur;S.t+=dt*S.speed*(r.T/9);
 while(r.fired<r.events.length&&r.events[r.fired].t<=S.t)fireEvent(r,r.events[r.fired++]);
 drawMap(cv,S.map,r,Math.min(S.t,r.T),COLS());paintClock(r);
 if(S.t>=r.T){const w=r.winner;S.last=r;applyRound(S,r);paintScore();paintBoards();S.wait=1.1;showBanner(w,r)}
}
function startRound(){
 const S=M.S;S.cur=simRound(S);S.t=0;const r=S.cur;r.guns={};S.c.forEach((c,i)=>c.ps.forEach(p=>r.guns[p.id]=pickGun(r.buys[i],p,S.round)));const hp={};r.events.forEach(e=>{if(e.type==="kill"){hp[e.k]=Math.max(1,(hp[e.k]??100)-RI(0,60));e.khp=hp[e.k]}});paintScore();paintBoards();
 r.note.forEach(n=>addFeed('<span class="sig">'+esc(n)+"</span>"));
 addFeed(`<span class="lab">Manche ${r.round} · ${r.atk===0?"attaque":"défense"} · ${BUY_FR[r.buys[0]]} contre ${BUY_FR[r.buys[1]]}</span>`);
}
function afterRound(){const S=M.S;if(mapOver(S)){finishMap();return}if(S.round===13){S.pause="Mi-temps";paintOv()}else if(S.round===25){S.pause="Prolongation";paintOv()}}
function nameOf(id){for(const c of M.S.c){const p=c.ps.find(x=>x.id===id);if(p)return p.nick}return "?"}
function fireEvent(r,e){
 const cls=id=>r.teamOf[id]===0?"m":"f";
 if(e.type==="kill"){addFeed(`<span class="${cls(e.k)}">${esc(nameOf(e.k))}</span> élimine <span class="${cls(e.v)}">${esc(nameOf(e.v))}</span>${r.guns&&r.guns[e.k]?` <span class="dim">au ${esc(r.guns[e.k].n)}</span>`:""}${e.a?` <span class="dim">(aide ${esc(nameOf(e.a))})</span>`:""}`);paintBoardsLive(r)}
 else if(e.type==="plant")addFeed(`<span class="sig">Charge posée sur le site ${r.site}.</span>`);
}
function addFeed(h){const f=$("#feed");if(!f)return;const d=document.createElement("div");d.innerHTML=h;f.appendChild(d);while(f.children.length>60)f.firstChild.remove();f.scrollTop=f.scrollHeight}
function runOut(S){while(!mapOver(S))applyRound(S,simRound(S))}
function skipMap(){const S=M.S;S.pause=null;S.dec=null;{const db=$("#dec");if(db)db.remove()}S.tout=0;if(S.cur)applyRound(S,S.cur);runOut(S);finishMap()}
function recordMap(){
 const S=M.S,w=S.score[0]>S.score[1]?0:1,rounds=S.score[0]+S.score[1];M.serie[w]++;M.res.push({map:S.map,score:[...S.score],stat:S.stat});
 [...S.c[0].ps,...S.c[1].ps].forEach(p=>{const s=S.stat[p.id];(M&&M.t&&M.t.scrim?[]:[p.st,p.cr]).forEach(o=>{o.mp++;o.r+=rounds;o.k+=s.k;o.d+=s.d;o.a+=s.a;o.h=(o.h||0)+(s.h||0)})});
 me().maps[S.map]=clamp(me().maps[S.map]+1.2,20,100);
}
function finishMap(){recordMap();M.phase="result";render()}
function simulateSeries(){
 while(M.steps.length){const s=M.steps[0],sorted=[...M.pool].sort((a,b)=>me().maps[b]-me().maps[a]);vetoAct(s==="ban"?sorted[sorted.length-1]:sorted[0])}
 while(M.serie[0]<need()&&M.serie[1]<need()){M.S=makeSim();runOut(M.S);recordMap();M.i++}
 closeMatch();
}
function closeMatch(){if(M&&M.t&&M.t.scrim)return scrimClose();
 const t=me(),o=M.opp,m=M.m,won=M.serie[0]>M.serie[1],f=M.flip,score=M.res.map(x=>x.score.join("-")).join(", ");
 m.mw=f?[M.serie[1],M.serie[0]]:[...M.serie];m.maps=M.res.map(x=>({map:x.map,s:f?[x.score[1],x.score[0]]:x.score}));settle(m);
 starters(t).forEach(p=>{p.fat=clamp(p.fat+9,0,100);p.moral=clamp(p.moral+(won?6:-3),25,100)});
 G.recent.unshift({label:M.t.name,opp:o.name,won,score,ser:M.serie.join("-")});G.recent=G.recent.slice(0,12);
 mail("Head coach",(won?"Victoire":"Défaite")+" contre "+o.name,`${M.t.name}. Série ${M.serie.join("-")} (${score}).`);
 mailAfterMatch(won,o);try{ivAfterMatch(won,o,M.t)}catch(e){}M=null;G.view="home";resolveStep();render();
}

}

 p.likes=Math.round(S.fol*R(.02,.06));p.rts=Math.round(p.likes*R(.1,.25));p.nrep=Math.round(p.likes*R(.03,.08));

function gunSvg(w){const x=62-w.st-w.bw,y=6;let s=`<path d="M${x} ${y}h${w.bw}v5H${x}z"/><path d="M${x-w.bl} ${y+1}h${w.bl}v${w.tb?3:2}H${x-w.bl}z"/><path d="M${x+w.bw-8} ${y+5}h5l-2 7h-5z"/>`;if(w.st)s+=`<path d="M${x+w.bw} ${y}h${w.st}v7h-4l-${w.st-4} -2z"/>`;if(w.mh)s+=`<path d="M${x+w.bw*.35} ${y+5}h4l1 ${w.mh}h-4z"/>`;if(w.sc)s+=`<path d="M${x+5} 1h13v4H${x+5}z"/>`;if(w.dr)s+=`<circle cx="${x+w.bw*.4}" cy="${y+8}" r="5"/>`;return `<svg class="gun" viewBox="0 0 64 20" role="img" aria-label="${esc(w.n)}"><g fill="currentColor">${s}</g></svg>`}
